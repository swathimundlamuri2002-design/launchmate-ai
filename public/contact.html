<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact LaunchMate AI</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f6f7f9; color: #111; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border: 1px solid #555; border-radius: 8px; }
  textarea { min-height: 140px; }
  button { margin-top: 16px; padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 8px; background: #0b5fff; color: #fff; cursor: pointer; }
  button:disabled { background: #7a8aa8; }
  #status { margin-top: 12px; font-weight: bold; }
  .hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <h1>Contact us</h1>
  <p><a href="/">Back to LaunchMate AI</a></p>
  <form id="f">
    <label for="name">Your name</label>
    <input id="name" name="name" maxlength="80" required>
    <label for="email">Your email</label>
    <input id="email" name="email" type="email" maxlength="120" required>
    <label for="message">Message</label>
    <textarea id="message" name="message" maxlength="2000" required></textarea>
    <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <button id="b" type="submit">Send message</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const f = document.getElementById("f");
  const b = document.getElementById("b");
  const st = document.getElementById("status");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    b.disabled = true;
    st.textContent = "Sending...";
    try {
      const r = await fetch("/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.fromEntries(new FormData(f)))
      });
      const data = await r.json();
      if (r.ok) { st.textContent = "Thank you! Your message was sent."; f.reset(); }
      else { st.textContent = data.error || "Something went wrong."; }
    } catch {
      st.textContent = "Network error. Please try again.";
    }
    b.disabled = false;
  });
</script>
</body>
</html>
